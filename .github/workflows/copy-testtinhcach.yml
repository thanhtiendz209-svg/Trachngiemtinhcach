name: Copy Testtinhcach source

on:
  push:
    paths:
      - '.github/workflows/copy-testtinhcach.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out destination
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Copy and verify the complete source tree
        env:
          SOURCE_COMMIT: '99b4a707d0769f21a41df7b50cb9b75a28139677'
          SOURCE_TREE: '57c351213e8bf422a4bcb9f36116112d45f64c1a'
        run: |
          set -euo pipefail
          git -c http.https://github.com/.extraheader= fetch --no-tags --depth=1 https://github.com/thanhtiendz209-svg/Testtinhcach.git "$SOURCE_COMMIT"
          test "$(git rev-parse "$SOURCE_COMMIT^{tree}")" = "$SOURCE_TREE"
          git read-tree --reset "$SOURCE_COMMIT^{tree}"
          test "$(git write-tree)" = "$SOURCE_TREE"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Copy complete website from Testtinhcach ($SOURCE_COMMIT)"
          git push origin HEAD:main
