<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="400" height="440" role="img" aria-label="R - Thực tế"><title>R – Thực tế (Realistic)</title><style>.bob{animation:bob 2s ease-in-out infinite}.wig{transform-box:fill-box;transform-origin:50% 100%;animation:wig 1.3s ease-in-out infinite}.flt{animation:flt 3s ease-in-out infinite}.flt2{animation:flt 3.4s ease-in-out infinite reverse}.spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin 9s linear infinite}.eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4s infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes wig{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}</style><defs><filter id="sketch" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="3" result="n"><animate attributeName="seed" values="3;7;11;5" dur="0.9s" repeatCount="indefinite" calcMode="discrete"/></feTurbulence><feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/></filter></defs><g filter="url(#sketch)" stroke-linecap="round" stroke-linejoin="round"><path d="M60 150 Q40 60 150 40 Q290 14 355 100 Q405 190 350 290 Q290 385 170 372 Q50 360 60 250z" fill="#fde8cf" stroke="#3b2f2f" stroke-width="4" stroke-dasharray="2 0"/><g class="spin"><circle cx="80" cy="95" r="24" fill="none" stroke="#3b2f2f" stroke-width="12" stroke-dasharray="9 7"/><circle cx="80" cy="95" r="16" fill="#cfd6dd" stroke="#3b2f2f" stroke-width="4"/><circle cx="80" cy="95" r="5" fill="#fde8cf" stroke="#3b2f2f" stroke-width="3"/></g><g class="flt"><rect x="315" y="95" width="46" height="24" rx="4" fill="#e07b39" stroke="#3b2f2f" stroke-width="4"/><path d="M322 95 v-9 h32 v9" fill="none" stroke="#3b2f2f" stroke-width="4"/></g><ellipse cx="200" cy="362" rx="80" ry="12" fill="#3b2f2f" fill-opacity=".15"/><g class="bob"><ellipse cx="178" cy="356" rx="20" ry="9" fill="#6b4226" stroke="#3b2f2f" stroke-width="4"/><ellipse cx="222" cy="356" rx="20" ry="9" fill="#6b4226" stroke="#3b2f2f" stroke-width="4"/><path d="M150 242 Q200 218 250 242 L262 346 Q200 362 138 346z" fill="#f4a259" stroke="#3b2f2f" stroke-width="4" stroke-linejoin="round"/><path d="M158 252 Q122 280 130 318" fill="none" stroke="#3b2f2f" stroke-width="22" stroke-linecap="round"/><path d="M158 252 Q122 280 130 318" fill="none" stroke="#ffd9b8" stroke-width="16" stroke-linecap="round"/><circle cx="130" cy="320" r="11" fill="#ffd9b8" stroke="#3b2f2f" stroke-width="4"/><path d="M242 252 Q274 268 280 296" fill="none" stroke="#3b2f2f" stroke-width="22" stroke-linecap="round"/><path d="M242 252 Q274 268 280 296" fill="none" stroke="#ffd9b8" stroke-width="16" stroke-linecap="round"/><circle cx="200" cy="170" r="50" fill="#ffd9b8" stroke="#3b2f2f" stroke-width="4"/><g class="eyes"><circle cx="182" cy="174" r="4.5" fill="#3b2f2f"/><circle cx="218" cy="174" r="4.5" fill="#3b2f2f"/></g><ellipse cx="166" cy="190" rx="9" ry="5.5" fill="#ff9aa9" fill-opacity=".6"/><ellipse cx="234" cy="190" rx="9" ry="5.5" fill="#ff9aa9" fill-opacity=".6"/><path d="M186 192 Q200 207 214 192" fill="none" stroke="#3b2f2f" stroke-width="4"/><path d="M150 142 Q200 70 250 142 Z" fill="#ffd23f" stroke="#3b2f2f" stroke-width="4" stroke-linejoin="round"/><rect x="140" y="140" width="120" height="13" rx="6" fill="#ffc107" stroke="#3b2f2f" stroke-width="4"/><path d="M200 84 V140" stroke="#3b2f2f" stroke-width="3"/><g class="wig"><path d="M270 305 L322 232" stroke="#3b2f2f" stroke-width="20" stroke-linecap="round"/><path d="M270 305 L322 232" stroke="#9aa5b1" stroke-width="13" stroke-linecap="round"/><circle cx="326" cy="226" r="17" fill="#9aa5b1" stroke="#3b2f2f" stroke-width="4"/><circle cx="326" cy="226" r="7" fill="#fde8cf" stroke="#3b2f2f" stroke-width="3"/></g><circle cx="280" cy="298" r="11" fill="#ffd9b8" stroke="#3b2f2f" stroke-width="4"/></g><circle cx="52" cy="400" r="0"/><g font-family="'Segoe Print','Comic Sans MS','Bradley Hand',cursive" text-anchor="middle" fill="#3b2f2f"><circle cx="345" cy="352" r="30" fill="#f4a259" stroke="#3b2f2f" stroke-width="4"/><text x="345" y="366" font-size="38" font-weight="700" fill="#fff">R</text><text x="190" y="415" font-size="30" font-weight="700">Thực tế</text><text x="190" y="435" font-size="14" opacity=".7">Realistic</text></g></g></svg>