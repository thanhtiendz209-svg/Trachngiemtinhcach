<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="400" height="440" role="img" aria-label="I - Nghiên cứu"><title>I – Nghiên cứu (Investigative)</title><style>.bob{animation:bob 2s ease-in-out infinite}.wig{transform-box:fill-box;transform-origin:50% 100%;animation:wig 1.3s ease-in-out infinite}.flt{animation:flt 3s ease-in-out infinite}.flt2{animation:flt 3.4s ease-in-out infinite reverse}.spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin 9s linear infinite}.eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4s infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes wig{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}</style><defs><filter id="sketch" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="3" result="n"><animate attributeName="seed" values="3;7;11;5" dur="0.9s" repeatCount="indefinite" calcMode="discrete"/></feTurbulence><feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/></filter></defs><g filter="url(#sketch)" stroke-linecap="round" stroke-linejoin="round"><path d="M60 150 Q40 60 150 40 Q290 14 355 100 Q405 190 350 290 Q290 385 170 372 Q50 360 60 250z" fill="#dcebfa" stroke="#3b2f2f" stroke-width="4" stroke-dasharray="2 0"/><g class="spin"><g fill="none" stroke="#3b2f2f" stroke-width="4"><ellipse cx="80" cy="95" rx="30" ry="11"/><ellipse cx="80" cy="95" rx="30" ry="11" transform="rotate(60 80 95)"/><ellipse cx="80" cy="95" rx="30" ry="11" transform="rotate(120 80 95)"/></g><circle cx="80" cy="95" r="7" fill="#ffd23f" stroke="#3b2f2f" stroke-width="3"/></g><g class="flt"><circle cx="330" cy="105" r="9" fill="#d9f0ff" stroke="#3b2f2f" stroke-width="3"/><circle cx="350" cy="80"