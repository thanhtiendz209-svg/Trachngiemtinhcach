dth="4" stroke-linejoin="round"/><path d="M262 316 l14 -22 h28 l14 22 q3 8 -6 8 h-44 q-9 0 -6 -8z" fill="#7ed957" stroke="#3b2f2f" stroke-width="3" stroke-linejoin="round"/><path d="M268 262 h26" stroke="#3b2f2f" stroke-width="5" stroke-linecap="round"/></g><circle cx="280" cy="298" r="11" fill="#ffd9b8" stroke="#3b2f2f" stroke-width="4"/></g><circle cx="52" cy="400" r="0"/><g font-family="'Segoe Print','Comic Sans MS','Bradley Hand',cursive" text-anchor="middle" fill="#3b2f2f"><circle cx="345" cy="352" r="30" fill="#4f86c6" stroke="#3b2f2f" stroke-width="4"/><text x="345" y="366" font-size="38" font-weight="700" fill="#fff">I</text><text x="190" y="415" font-size="30" font-weight="700">Nghiên cứu</text><text x="190" y="435" font-size="14" opacity=".7">Investigative</text></g></g></svg>