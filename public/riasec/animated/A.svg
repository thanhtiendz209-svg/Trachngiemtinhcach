<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="400" height="440" role="img" aria-label="A - Nghệ thuật"><title>A – Nghệ thuật (Artistic)</title><style>.bob{animation:bob 2s ease-in-out infinite}.wig{transform-box:fill-box;transform-origin:50% 100%;animation:wig 1.3s ease-in-out infinite}.flt{animation:flt 3s ease-in-out infinite}.flt2{animation:flt 3.4s ease-in-out infinite reverse}.spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin 9s linear infinite}.eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4s infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes wig{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}</style><defs><filter id="sketch" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="3" result="n"><animate attributeName="seed" values="3;7;11;5" dur="0.9s" repeatCount="indefinite" calcMode="discrete"/></feTurbulence><feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/></filter></defs><g filter="url(#sketch)" stroke-linecap="round" stroke-linejoin="round"><path d="M60 150 Q40 60 150 40 Q290 14 355 100 Q405 190 350 290 Q290 385 170 372 Q50 360 60 250z" fill="#f3e1f7" stroke="#3b2f2f" stroke-width="4" stroke-dasharray="2 0"/><g class="spin"><path d="M60 100 q-8 -34 28 -38 q36 -3 36 24 q0 18 -18 12 q-14 -4 -14 8 q0 16 -22 10 q-8 -4 -10 -16z" fill="#f6dfb8" stroke="#3b2f2f" stroke-width="4" stroke-linejoin="round"/><circle cx="78" cy="78" r="5" fill="#e4577a"/><circle cx="96" cy="74" r="5" fill="#4f86c6"/><circle cx="108" cy="88" r="5" fill="#ffd23f"/></g><g class="flt"><path d="M336 120 v-40 l24 -6 v40" fill="none" stroke="#3b2f2f" stroke-width="5" stroke-linecap="round" stroke-lin