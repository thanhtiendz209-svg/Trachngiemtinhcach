<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="400" height="440" role="img" aria-label="ENTP - Người tranh biện">
<title>ENTP – Người tranh biện</title>
<style>
.bob{animation:bob 2s ease-in-out infinite}
.wig{transform-box:fill-box;transform-origin:50% 100%;animation:wig 1.3s ease-in-out infinite}
.flt{animation:flt 3s ease-in-out infinite}
.flt2{animation:flt 3.4s ease-in-out infinite reverse}
.spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin 9s linear infinite}
.eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes wig{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
</style>
<defs><filter id="sketch" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="3" result="n"><animate attributeName="seed" values="3;7;11;5" dur="0.9s" repeatCount="indefinite" calcMode="discrete"/></feTurbulence><feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/></filter></defs>
<g filter="url(#sketch)" stroke-linecap="round" stroke-linejoin="round">
<path d="M60 150 Q40 60 150 40 Q290 14 355 100 Q405 190 350 290 Q290 385 170 372 Q50 360 60 250z" fill="#f1e2fb" stroke="#3b2f2f" stroke-width="4"/>
<g class="flt"><g transform="translate(82 100) scale(1.1)"><path d="M6 -30 L-20 12 H2 L-8 42 L28 -4 H6 L20 -30z" fill="#ffd23f" stroke="#3b2f2f" stroke-width="3.6363636363636362" stroke-linejoin="round" stroke-linecap="round" /></g></g><g class="flt2"><text x="346" y="112" font-size="36" font-weight="700" text-anchor="middle" fill="#a66cd6" font-family="'Segoe Print','Comic Sans MS',cursive">VS</text></g>
<ellipse cx="200" cy="362" rx="80" ry="12" fill="#3b2f2f" fill-opacity=".15"/>
<g class="bob">

<ellipse cx="178" cy="356" rx="20" ry="9" fill="#6b4226" stroke="#3b2f2f" stroke-width="4"/><ellipse cx="222" cy="356" rx="20" ry="9" fill="#6b4226" stroke="#3b2f2f" stroke-width="4"/>
<path d="M150 242 Q200 218 250 242 L262 346 Q200 362 138 346z" fill="#a66cd6" stroke="#3b2f2f" stroke-width="4" stroke-linejoin="round"/>

<path d="M158 252 Q122 280 130 318" fill="none" stroke="#3b2f2f" stroke-width="22" stroke-linecap="round"/><path d="M158 252 Q122 280 130 318" fill="none" stroke="#ffd9b8" stroke-width="16" stroke-linecap="round"/>
<circle cx="130" cy="320" r="11" fill="#ffd9b8" stroke="#3b2f2f" stroke-width="4"/>
<path d="M242 252 Q274 268 280 296" fill="none" stroke="#3b2f2f" stroke-width="22" stroke-linecap="round"/><path d="M242 252 Q274 268 280 296" fill="none" stroke="#ffd9b8" stroke-width="16" stroke-linecap="round"/>
<circle cx="200" cy="170" r="50" fill="#ffd9b8" stroke="#3b2f2f" stroke-width="4"/>
<path d="M151 170 Q146 108 200 108 Q254 108 249 170 Q232 134 200 138 Q168 134 151 170z" fill="#6b3fa0" stroke="#3b2f2f" stroke-width="4" stroke-linejoin="round"/>
<g class="eyes"><circle cx="182" cy="174" r="4.5" fill="#3b2f2f"/><circle cx="218" cy="174" r="4.5" fill="#3b2f2f"/></g>
<ellipse cx="166" cy="190" rx="9" ry="5.5" fill="#ff9aa9" fill-opacity=".6"/><ellipse cx="234" cy="190" rx="9" ry="5.5" fill="#ff9aa9" fill-opacity=".6"/>
<path d="M186 192 Q200 207 214 192" fill="none" stroke="#3b2f2f" stroke-width="4"/>
<path d="M168 164 L192 158" fill="none" stroke="#3b2f2f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M232 152 Q220 146 208 156" fill="none" stroke="#3b2f2f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

<g class="wig"><path d="M262 230 h72 a10 10 0 0 1 10 10 v36 a10 10 0 0 1 -10 10 h-42 l-16 14 v-14 h-14 a10 10 0 0 1 -10 -10 v-36 a10 10 0 0 1 10 -10z" fill="#fff" stroke="#3b2f2f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="298" y="272" font-size="42" font-weight="700" text-anchor="middle" fill="#e5533d" font-family="'Segoe Print','Comic Sans MS',cursive">!</text></g>
<circle cx="280" cy="298" r="11" fill="#ffd9b8" stroke="#3b2f2f" stroke-width="4"/>
</g>
