<rect x="296" y="334" width="88" height="36" rx="18" fill="#2c5aa0" stroke="#3b2f2f" stroke-width="4"/>
<text x="340" y="360" font-size="22" font-weight="700" text-anchor="middle" fill="#fff" font-family="'Segoe Print','Comic Sans MS',cursive">ESTJ</text>
<text x="190" y="415" font-size="24" font-weight="700" text-anchor="middle" fill="#3b2f2f" font-family="'Segoe Print','Comic Sans MS',cursive">Người điều hành</text>
</g></svg>